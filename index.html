<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ash Play Store - Download Android Apps</title>
  <meta name="description" content="Discover and download Android apps from Ash Play Store. Browse app details, ratings, and direct APK install links in a clean Play-style interface." />
  <meta name="keywords" content="Ash Play Store, Android apps, APK download, app store, mobile apps" />
  <meta name="author" content="Ash Store" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#01875f" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ash Play Store - Download Android Apps" />
  <meta property="og:description" content="Browse and install Android apps with ratings and direct APK links from Ash Play Store." />
  <meta property="og:image" content="favicon.svg" />
  <meta property="og:site_name" content="Ash Play Store" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Ash Play Store - Download Android Apps" />
  <meta name="twitter:description" content="Browse and install Android apps with ratings and direct APK links from Ash Play Store." />
  <meta name="twitter:image" content="favicon.svg" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ash Play Store",
      "description": "A Play-style web store to discover and download Android apps.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>
<body>
  <main class="play-shell">
    <header class="top-bar" aria-label="Store header">
      <div class="brand-wrap">
        <div class="play-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-eyebrow">Google Play style</p>
          <h1>Ash Play Store</h1>
        </div>
      </div>

      <label class="search-wrap" for="searchInput">
        <span class="search-icon" aria-hidden="true">🔎</span>
        <input id="searchInput" type="search" placeholder="Search for apps & games" autocomplete="off" />
      </label>

      <div class="chip-row" aria-label="categories">
        <button class="chip active" type="button">For you</button>
        <button class="chip" type="button">Top charts</button>
        <button class="chip" type="button">Categories</button>
        <button class="chip" type="button">Kids</button>
      </div>
    </header>

    <section class="apps-section" aria-label="apps">
      <div class="section-head">
        <h2>Recommended for you</h2>
        <button class="see-all" type="button">See all</button>
      </div>
      <div id="appsContainer" class="apps-grid"></div>
    </section>
  </main>

  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="close-btn" type="button" aria-label="Close">x</button>
      <div class="modal-header">
        <div id="modalIcon" class="modal-icon"></div>
        <div>
          <h3 id="modalTitle"></h3>
          <p id="modalVersion"></p>
        </div>
      </div>

      <div class="modal-stats">
        <div id="modalRating"></div>
        <div id="modalDownloads"></div>
      </div>

      <p id="modalDescription" class="modal-description"></p>
      <div id="modalDetails" class="modal-details"></div>

      <div class="modal-actions">
        <button id="shareBtn" class="btn-ghost" type="button"><span>Share</span></button>
        <button id="installBtn" class="btn-primary" type="button"><span>Install</span></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
